<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF7628'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%23111318'%3EL%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="מני לוי — מפתח Full-Stack המתמחה במערכות Web עסקיות ופתרונות מעשיים." />
  <title>אודות | Levi-Tec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="theme-color" content="#111318" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og.svg" />
</head>
<body>
  <a class="skip-link" href="#main"></a>
  <div data-mount="header"></div>
  <main id="main">
    <section class="section"><div class="container">
      <div id="aboutHead"></div>
      <div class="grid" style="grid-template-columns:1fr;margin-top:2.5rem" id="aboutGrid"></div>
      <div style="margin-top:2rem;display:flex;gap:.75rem;flex-wrap:wrap" id="aboutCtas"></div>
    </div></section>
  </main>
  <div data-mount="footer"></div>
  <script type="module">
    import { initPage } from "/src/shared.ts";
    import { aboutPage } from "/src/texts/aboutPage.ts";
    import { card, checkList, sectionHead } from "/src/ui/components.ts";
    const t = aboutPage;
    document.querySelector("#aboutHead").innerHTML = sectionHead(t.head.eyebrow, t.head.title, t.head.lead);
    document.querySelector("#aboutGrid").innerHTML =
      card(`<span class="logo-mark" style="width:5rem;height:5rem;font-size:2rem" aria-hidden="true">${t.mark}</span>
        <h3 style="font-size:1.4rem">${t.name}</h3>
        <p style="color:var(--muted)">${t.role}</p>
        <p class="ltr" style="font-size:.85rem;color:var(--muted)">${t.stack}</p>
        <p>${t.profile}</p>`) +
      card(`<h3><i class="ti ${t.approach.icon}" aria-hidden="true"></i> ${t.approach.title}</h3>` + checkList(t.approach.items)) +
      card(`<h3><i class="ti ${t.value.icon}" aria-hidden="true"></i> ${t.value.title}</h3><p>${t.value.text}</p>`) +
      card(`<h3><i class="ti ${t.honesty.icon}" aria-hidden="true"></i> ${t.honesty.title}</h3><p style="font-size:.92rem">${t.honesty.text}</p>`);
    document.querySelector("#aboutCtas").innerHTML =
      `<a class="btn btn-primary" href="/contact/">${t.primaryCta}</a><a class="btn btn-secondary" href="/process/">${t.secondaryCta}</a>`;
    initPage("about");
  </script>
</body>
</html>
