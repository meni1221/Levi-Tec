<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF7628'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='900' font-size='34' text-anchor='middle' fill='%23111318'%3EL%3C/text%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="מדיניות הפרטיות של אתר Levi-Tec." />
  <title>מדיניות פרטיות | Levi-Tec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="theme-color" content="#111318" />
  <meta property="og:type" content="website" />
</head>
<body>
  <a class="skip-link" href="#main"></a>
  <div data-mount="header"></div>
  <main id="main">
    <section class="section"><div class="container">
      <div id="privacyHead"></div>
      <div id="privacyBody"></div>
    </div></section>
  </main>
  <div data-mount="footer"></div>
  <script type="module">
    import { initPage } from "/src/shared.ts";
    import { siteConfig } from "/src/site.ts";
    import { privacyPage } from "/src/texts/legal.ts";
    import { card, checkList, sectionHead } from "/src/ui/components.ts";
    const t = privacyPage;
    document.querySelector("#privacyHead").innerHTML = sectionHead(t.head.eyebrow, t.head.title, t.head.lead);
    document.querySelector("#privacyBody").innerHTML =
      `<div style="margin-top:2.5rem">` + card(`<h3><i class="ti ${t.collected.icon}" aria-hidden="true"></i> ${t.collected.title}</h3>` + checkList(t.collected.items)) + `</div>
      <div style="margin-top:1.25rem">` + card(`<h3><i class="ti ${t.contact.icon}" aria-hidden="true"></i> ${t.contact.title}</h3>
        <p>${t.contact.emailLabel} <a href="mailto:${siteConfig.email}" class="ltr" style="color:var(--brand)">${siteConfig.email}</a></p>
        <p>${t.contact.phoneLabel} <a href="tel:+${siteConfig.whatsappNumber}" class="ltr" style="color:var(--brand)">${t.contact.phoneDisplay}</a></p>`) + `</div>
      <p style="color:var(--muted);font-size:.85rem;margin-top:1.5rem">${t.note}</p>`;
    initPage("");
  </script>
</body>
</html>
