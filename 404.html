<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>העמוד לא נמצא | Levi-Tec</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="theme-color" content="#111318" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og.svg" />
</head>
<body>
  <div data-mount="header"></div>
  <main class="container" style="padding:6rem 1.25rem;text-align:center" id="notFound"></main>
  <div data-mount="footer"></div>
  <script type="module">
    import { initPage } from "/src/shared.ts";
    import { notFound } from "/src/texts/notFound.ts";
    document.querySelector("#notFound").innerHTML =
      `<p class="ltr" style="color:var(--brand);font-weight:800">${notFound.code}</p>
      <h1>${notFound.title}</h1>
      <p style="color:var(--text-dim)">${notFound.sub}</p>
      <div style="display:flex;gap:.75rem;justify-content:center;margin-top:2rem;flex-wrap:wrap">
        <a class="btn btn-primary" href="/">${notFound.homeCta}</a>
        <a class="btn btn-secondary" href="/contact/">${notFound.contactCta}</a>
      </div>`;
    initPage("");
  </script>
</body>
</html>
